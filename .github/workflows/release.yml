name: Build → Tag → Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm install terser clean-css

      - name: Create branch
        run: |
          git checkout -b release-temp

      - name: Build
        run: |
          # (dein Build-Code bleibt unverändert)

      - name: Commit build
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "build v${{ github.event.inputs.version }}"

      - name: Push branch FIRST
        run: |
          git push origin release-temp --force

      - name: Checkout pushed branch
        run: |
          git fetch origin release-temp
          git checkout release-temp

      - name: Create tag from pushed commit
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete branch
        run: |
          git push origin --delete release-temp || true